# GHCR Docker registry credentials
# Encrypt this file with SOPS before committing:
#   sops -e ghcr-creds.template.yaml > ghcr-creds.sops.yaml
#   rm ghcr-creds.template.yaml
#
# Generate the .dockerconfigjson value:
#   echo -n '{"auths":{"ghcr.io":{"auth":"'$(echo -n "USERNAME:GITHUB_PAT" | base64)'"}}}' | base64
apiVersion: v1
data:
  .dockerconfigjson: BASE64_ENCODED_DOCKER_CONFIG
kind: Secret
metadata:
  name: ghcr-creds
  namespace: pm
type: kubernetes.io/dockerconfigjson
