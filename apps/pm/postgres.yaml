# CloudNativePG PostgreSQL cluster for PM with pgvector
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pm-db
  namespace: pm
spec:
  instances: 1

  # PostgreSQL 18 with pgvector (included in CNPG base image)
  imageName: ghcr.io/cloudnative-pg/postgresql:18

  # Monitoring: add annotations for Alloy auto-discovery
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"

  bootstrap:
    initdb:
      database: pm
      owner: pm
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector

  storage:
    storageClass: longhorn
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  postgresql:
    parameters:
      shared_buffers: "128MB"
      effective_cache_size: "256MB"
      work_mem: "8MB"
