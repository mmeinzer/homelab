# PM application secrets
# Encrypt this file with SOPS before committing:
#   sops -e pm-secrets.template.yaml > pm-secrets.sops.yaml
#   rm pm-secrets.template.yaml
#
# All values should be base64 encoded:
#   echo -n "your-secret-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: pm-secrets
  namespace: pm
type: Opaque
data:
  # Google OAuth credentials
  google-client-id: BASE64_GOOGLE_CLIENT_ID
  google-client-secret: BASE64_GOOGLE_CLIENT_SECRET
  # OpenRouter LLM
  openrouter-api-key: BASE64_OPENROUTER_API_KEY
  openrouter-model: BASE64_OPENROUTER_MODEL
  # Slack integration
  slack-bot-token: BASE64_SLACK_BOT_TOKEN
  slack-signing-secret: BASE64_SLACK_SIGNING_SECRET
  # Session secret (generate with: openssl rand -base64 32)
  session-secret: BASE64_SESSION_SECRET
  # Base URL for OAuth callbacks (e.g., https://pm.example.com)
  base-url: BASE64_BASE_URL
