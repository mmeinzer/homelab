# Cloudflare Tunnel credentials
# Encrypt this file with SOPS before committing:
#   sops -e cloudflared-credentials.template.yaml > cloudflared-credentials.sops.yaml
#   rm cloudflared-credentials.template.yaml
#
# Create a tunnel first:
#   cloudflared tunnel create pm-tunnel
# This generates a credentials file at ~/.cloudflared/<TUNNEL_ID>.json
# Base64 encode that file's contents for the credentials.json field below:
#   base64 -i ~/.cloudflared/<TUNNEL_ID>.json
#
# Also update cloudflared.yaml and dns-endpoint.yaml with the TUNNEL_ID
apiVersion: v1
data:
  credentials.json: BASE64_ENCODED_TUNNEL_CREDENTIALS
kind: Secret
metadata:
  name: cloudflared-credentials
  namespace: pm
type: Opaque
