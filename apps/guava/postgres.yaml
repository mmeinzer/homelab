# CloudNativePG PostgreSQL cluster for Guava
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: guava-db
  namespace: guava
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:18

  # Monitoring: add annotations for Alloy auto-discovery
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"

  bootstrap:
    initdb:
      database: guava
      owner: guava

  storage:
    storageClass: longhorn
    size: 5Gi

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

  postgresql:
    parameters:
      shared_buffers: "512MB"
      effective_cache_size: "1GB"
      work_mem: "16MB"
      archive_timeout: "300"

  backup:
    barmanObjectStore:
      destinationPath: s3://guava-kube-backups/cnpg/guava-db
      endpointURL: https://afc0de0b67de79f311811d5c36e790bd.r2.cloudflarestorage.com
      wal:
        compression: gzip
      data:
        compression: gzip
      s3Credentials:
        accessKeyId:
          name: r2-credentials
          key: access-key-id
        secretAccessKey:
          name: r2-credentials
          key: secret-access-key
    retentionPolicy: "30d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: guava-db-weekly
  namespace: guava
spec:
  schedule: "0 2 * * 7"
  backupOwnerReference: self
  cluster:
    name: guava-db
