apiVersion: apps/v1
kind: Deployment
metadata:
  name: guava-solver
  namespace: guava
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guava-solver
  template:
    metadata:
      labels:
        app: guava-solver
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: guava-solver
          image: ghcr.io/mmeinzer/guava-solver:latest
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: guava-db-app
                  key: uri
            - name: POLL_INTERVAL_SECONDS
              value: "5"
            - name: SOLVER_TIMEOUT_SECONDS
              value: "300"
