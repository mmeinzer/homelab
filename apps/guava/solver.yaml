apiVersion: apps/v1
kind: Deployment
metadata:
  name: guava-solver
  namespace: guava
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guava-solver
  template:
    metadata:
      labels:
        app: guava-solver
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: guava-solver
          image: ghcr.io/mmeinzer/guava-solver:latest
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          startupProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["true"]
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: guava-secrets
                  key: database-url
            - name: POLL_INTERVAL_SECONDS
              value: "5"
            - name: SOLVER_TIMEOUT_SECONDS
              value: "300"
