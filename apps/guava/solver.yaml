apiVersion: apps/v1
kind: Deployment
metadata:
  name: guava-solver
  namespace: guava
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guava-solver
  template:
    metadata:
      labels:
        app: guava-solver
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: guava-solver
          image: ghcr.io/mmeinzer/guava-solver:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            # TODO: fix Dockerfile to run as non-root, then add runAsNonRoot: true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: guava-secrets
                  key: database-url
            - name: POLL_INTERVAL_SECONDS
              value: "5"
            - name: SOLVER_TIMEOUT_SECONDS
              value: "300"
