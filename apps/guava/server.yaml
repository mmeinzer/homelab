apiVersion: apps/v1
kind: Deployment
metadata:
  name: guava-server
  namespace: guava
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guava-server
  template:
    metadata:
      labels:
        app: guava-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: guava-server
          image: ghcr.io/mmeinzer/guava:latest
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: guava-secrets
                  key: database-url
            # OpenTelemetry tracing configuration
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.observability.svc:4318"
            - name: OTEL_SERVICE_NAME
              value: "guava-server"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: guava-server
  namespace: guava
spec:
  selector:
    app: guava-server
  ports:
    - port: 80
      targetPort: 8080
