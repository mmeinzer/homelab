apiVersion: apps/v1
kind: Deployment
metadata:
  name: guava-server
  namespace: guava
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guava-server
  template:
    metadata:
      labels:
        app: guava-server
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: guava-server
          image: ghcr.io/mmeinzer/guava:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: guava-secrets
                  key: database-url
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: guava-server
  namespace: guava
spec:
  selector:
    app: guava-server
  ports:
    - port: 80
      targetPort: 8080
