apiVersion: apps/v1
kind: Deployment
metadata:
  name: guava-server
  namespace: guava
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guava-server
  template:
    metadata:
      labels:
        app: guava-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: guava-server
          image: ghcr.io/mmeinzer/guava:latest
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: guava-db-app
                  key: uri
            # OpenTelemetry tracing configuration
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "alloy.observability.svc:4318"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=homelab,service.namespace=guava"
            # SMTP (Resend) for transactional email
            - name: SMTP_HOST
              value: "smtp.resend.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USERNAME
              value: "resend"
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: smtp-password
            - name: SMTP_FROM
              value: "Guava <noreply@mail.guavasuite.com>"
            - name: FRONTEND_BASE_URL
              value: "https://app.guavasuite.com"
            # R2 file uploads
            - name: R2_ACCOUNT_ID
              value: "afc0de0b67de79f311811d5c36e790bd"
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: r2-uploads-credentials
                  key: access-key-id
            - name: R2_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: r2-uploads-credentials
                  key: secret-access-key
            - name: R2_BUCKET_NAME
              value: "guava-files"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: guava-server
  namespace: guava
spec:
  selector:
    app: guava-server
  ports:
    - port: 80
      targetPort: 8080
