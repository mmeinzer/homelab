# yamllint configuration for Kubernetes YAML
# Relaxed rules suitable for K8s manifests and Helm values

extends: default

rules:
  # Kubernetes manifests often have long lines (esp. annotations, base64)
  line-length:
    max: 200
    level: warning
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  # Allow 'yes', 'no', 'on', 'off' as they appear in K8s configs
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
    check-keys: false

  # K8s uses 2-space indentation
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

  # Allow multiple documents in one file (common in K8s)
  document-start: disable
  document-end: disable

  # Braces and brackets - relaxed for inline JSON in ConfigMaps
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0

  # Comments - allow inline comments
  comments:
    require-starting-space: true
    ignore-shebangs: true
    min-spaces-from-content: 1

  # Allow empty values (common in K8s for optional fields)
  empty-values:
    forbid-in-block-mappings: false
    forbid-in-flow-mappings: false

  # Colons - standard spacing
  colons:
    max-spaces-before: 0
    max-spaces-after: 1

  # Trailing spaces - disallow
  trailing-spaces: enable

  # New line at end of file
  new-line-at-end-of-file: enable
