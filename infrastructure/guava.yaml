apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guava
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mmeinzer/homelab.git
    targetRevision: main
    path: apps/guava
  destination:
    server: https://kubernetes.default.svc
    namespace: guava
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
