apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/target: 10.12.14.200
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.vacant.dev`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
  tls: {}
