apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: "9.5.0"
    helm:
      releaseName: argocd
      valuesObject:
        fullnameOverride: argocd

        repoServer:
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /sops-age/age.key
            - name: XDG_CONFIG_HOME
              value: /home/argocd
          volumes:
            - name: sops-age
              secret:
                secretName: sops-age-key
            - name: custom-tools
              emptyDir: {}
          volumeMounts:
            - name: sops-age
              mountPath: /sops-age
            - name: custom-tools
              mountPath: /home/argocd/kustomize/plugin/viaduct.ai/v1/ksops/ksops
              subPath: ksops
          initContainers:
            - name: install-ksops
              image: viaductoss/ksops:v4.3.2
              command: [sh, -c]
              args:
                - cp /usr/local/bin/ksops /custom-tools/ksops
              volumeMounts:
                - name: custom-tools
                  mountPath: /custom-tools

        server:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/router.middlewares: authelia-authelia-forwardauth@kubernetescrd
            hostname: argocd.vacant.dev
            tls: true

        configs:
          cm:
            users.anonymous.enabled: "true"
            kustomize.buildOptions: --enable-alpha-plugins --enable-exec
            resource.customizations.ignoreResourceUpdates.ConfigMap: |
              jqPathExpressions:
                - '.metadata.annotations."cluster-autoscaler.kubernetes.io/last-updated"'
                - '.metadata.annotations."control-plane.alpha.kubernetes.io/leader"'
            resource.customizations.ignoreResourceUpdates.Endpoints: |
              jsonPointers:
                - /metadata
                - /subsets
            resource.customizations.ignoreResourceUpdates.all: |
              jsonPointers:
                - /status
            resource.customizations.ignoreResourceUpdates.apps_ReplicaSet: |
              jqPathExpressions:
                - '.metadata.annotations."deployment.kubernetes.io/desired-replicas"'
                - '.metadata.annotations."deployment.kubernetes.io/max-replicas"'
                - '.metadata.annotations."rollout.argoproj.io/desired-replicas"'
            resource.customizations.ignoreResourceUpdates.argoproj.io_Application: |
              jqPathExpressions:
                - '.metadata.annotations."notified.notifications.argoproj.io"'
                - '.metadata.annotations."argocd.argoproj.io/refresh"'
                - '.metadata.annotations."argocd.argoproj.io/hydrate"'
                - '.operation'
            resource.customizations.ignoreResourceUpdates.argoproj.io_Rollout: |
              jqPathExpressions:
                - '.metadata.annotations."notified.notifications.argoproj.io"'

          rbac:
            policy.default: role:admin

          params:
            server.insecure: "true"

          secret:
            createSecret: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
