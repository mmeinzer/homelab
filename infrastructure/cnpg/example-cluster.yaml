# CloudNativePG Cluster Template
#
# This is a TEMPLATE - not deployed (no ArgoCD app points to this directory).
# Copy to your app's directory to use.
#
# Usage:
#   cp infrastructure/cnpg/example-cluster.yaml apps/myapp/postgres.yaml
#   # Edit: name, namespace, database, owner, storage size
#   # Commit and push - ArgoCD will deploy it
#
# After deploying, CNPG creates these resources automatically:
#   - Secret: <cluster-name>-app (connection credentials)
#   - Service: <cluster-name>-rw (read-write, points to primary)
#   - Service: <cluster-name>-ro (read-only, load balances replicas)
#   - Service: <cluster-name>-r (read, load balances all instances)
#
# Connection string (from app in same namespace):
#   postgresql://<cluster-name>-rw:5432/<database>
#
# Credentials are in the -app secret:
#   kubectl get secret <cluster-name>-app -o jsonpath='{.data.password}' | base64 -d

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: myapp-db
  namespace: myapp  # Deploy in your app's namespace
spec:
  # Number of instances (1 = no HA, 3 = HA with auto-failover)
  instances: 1

  # PostgreSQL version
  imageName: ghcr.io/cloudnative-pg/postgresql:18

  # Monitoring: add annotations for Alloy auto-discovery
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"

  # Bootstrap: initialize a fresh database
  bootstrap:
    initdb:
      database: myapp
      owner: myapp
      # Optional: run SQL after init
      # postInitSQL:
      #   - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"

  # Storage configuration
  storage:
    storageClass: longhorn
    size: 5Gi

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # PostgreSQL configuration
  postgresql:
    parameters:
      # Tune for small instance
      shared_buffers: "128MB"
      effective_cache_size: "256MB"
      work_mem: "8MB"

  # Optional: Backup to R2 (uncomment to enable)
  # Requires: R2 bucket + API token with Object Read & Write on the bucket.
  # Create the token at: Cloudflare dashboard > R2 > Manage R2 API Tokens
  # The endpoint URL uses your Cloudflare account ID (visible in the R2 dashboard URL).
  # Create the credentials secret via SOPS — see docs/secrets-reference.md
  #
  # backup:
  #   barmanObjectStore:
  #     destinationPath: s3://guava-kube-backups/cnpg/myapp-db
  #     endpointURL: https://<account-id>.r2.cloudflarestorage.com
  #     wal:
  #       compression: gzip
  #     data:
  #       compression: gzip
  #     s3Credentials:
  #       accessKeyId:
  #         name: r2-credentials
  #         key: access-key-id
  #       secretAccessKey:
  #         name: r2-credentials
  #         key: secret-access-key
  #   retentionPolicy: "30d"

  # Optional: Scheduled base backups (requires backup config above)
  # WAL archiving is automatic once backup is configured — this just
  # controls how often a full base backup is taken.
  # ---
  # apiVersion: postgresql.cnpg.io/v1
  # kind: ScheduledBackup
  # metadata:
  #   name: myapp-db-weekly
  #   namespace: myapp
  # spec:
  #   schedule: "0 2 * * 7"  # Sunday 2 AM
  #   backupOwnerReference: self
  #   cluster:
  #     name: myapp-db
