apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mmeinzer/homelab.git
    targetRevision: main
    path: apps/pm
  destination:
    server: https://kubernetes.default.svc
    namespace: pm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
