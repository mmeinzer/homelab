apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: mimir-distributed
    targetRevision: 5.8.0
    helm:
      releaseName: mimir
      valuesObject:
        # Global settings - inject R2 credentials to all components
        global:
          extraEnv:
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: access_key_id
            - name: SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: secret_access_key

        # Mimir configuration
        mimir:
          structuredConfig:
            common:
              storage:
                backend: s3
                s3:
                  endpoint: afc0de0b67de79f311811d5c36e790bd.r2.cloudflarestorage.com
                  bucket_name: mimir-homelab
                  region: auto
                  access_key_id: ${ACCESS_KEY_ID}
                  secret_access_key: ${SECRET_ACCESS_KEY}
                  insecure: false
            blocks_storage:
              s3:
                bucket_name: mimir-homelab
            alertmanager_storage:
              s3:
                bucket_name: mimir-homelab
            ruler_storage:
              s3:
                bucket_name: mimir-homelab
            ingester:
              ring:
                replication_factor: 1
            limits:
              native_histograms_ingestion_enabled: true
              compactor_blocks_retention_period: 720h  # 30 days

        # Nginx gateway - single entry point for writes and queries
        nginx:
          enabled: true
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

        # Distributor - receives incoming writes
        distributor:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

        # Ingester - holds recent data in memory, flushes to R2
        ingester:
          replicas: 1
          zoneAwareReplication:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          persistentVolume:
            enabled: false

        # Querier - queries ingesters and store-gateway
        querier:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

        # Query frontend - caches and splits queries
        query_frontend:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

        # Store gateway - serves historical data from R2
        store_gateway:
          replicas: 1
          zoneAwareReplication:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          persistentVolume:
            enabled: false

        # Compactor - compacts blocks in R2
        compactor:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          persistentVolume:
            enabled: false

        # Disable optional components
        alertmanager:
          enabled: false
        ruler:
          enabled: false
        overrides_exporter:
          enabled: false
        query_scheduler:
          enabled: false

        # Disable minio - we use R2
        minio:
          enabled: false

        # Disable rollout operator for simple homelab
        rollout_operator:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
