apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.55.0
    helm:
      releaseName: loki
      valuesObject:
        # Explicit name to ensure predictable service naming
        fullnameOverride: loki

        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          limits_config:
            retention_period: 1440h  # 60 days
          compactor:
            retention_enabled: true
            working_directory: /var/loki/compactor
            delete_request_store: filesystem
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h

        singleBinary:
          replicas: 1
          podAnnotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "3100"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          persistence:
            enabled: true
            size: 20Gi
            storageClass: longhorn

        # Disable gateway
        gateway:
          enabled: false

        # Disable minio - using local filesystem
        minio:
          enabled: false

        # Disable simple scalable components (required for SingleBinary mode)
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0

        # Disable chunksCache, resultsCache for simplicity
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: []
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
