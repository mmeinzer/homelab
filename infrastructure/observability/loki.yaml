apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.24.0
    helm:
      releaseName: loki
      valuesObject:
        # Explicit name to ensure predictable service naming
        fullnameOverride: loki

        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          limits_config:
            retention_period: 720h  # 30 days
          compactor:
            retention_enabled: true
          storage:
            type: s3
            bucketNames:
              chunks: loki-homelab
              ruler: loki-homelab
              admin: loki-homelab
            s3:
              endpoint: afc0de0b67de79f311811d5c36e790bd.r2.cloudflarestorage.com
              region: auto
              accessKeyId: ${ACCESS_KEY_ID}
              secretAccessKey: ${SECRET_ACCESS_KEY}
              s3ForcePathStyle: true
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: index_
                  period: 24h

        singleBinary:
          replicas: 1
          extraArgs:
            - -config.expand-env=true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          persistence:
            enabled: false
          extraEnv:
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: access_key_id
            - name: SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: secret_access_key

        # Disable gateway
        gateway:
          enabled: false

        # Disable minio - we use R2
        minio:
          enabled: false

        # Disable simple scalable components (required for SingleBinary mode)
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0

        # Disable chunksCache, resultsCache for simplicity
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: []
