apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 28.2.0
    helm:
      releaseName: prometheus
      valuesObject:
        fullnameOverride: prometheus

        # Disable components we already have or don't need
        alertmanager:
          enabled: false
        kube-state-metrics:
          enabled: false  # Already deployed separately
        prometheus-node-exporter:
          enabled: false  # Already deployed separately
        prometheus-pushgateway:
          enabled: false

        server:
          fullnameOverride: prometheus

          # Persistent storage with Longhorn
          persistentVolume:
            enabled: true
            size: 20Gi
            storageClass: longhorn

          # Retention
          retention: 30d

          # Resources
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi

          # Pod annotations for self-scraping
          podAnnotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9090"

        # Override default serverFiles to exclude CNPG services from service-endpoints
        # (CNPG pods are scraped via kubernetes-pods job, services create duplicates)
        serverFiles:
          prometheus.yml:
            scrape_configs:
              - job_name: prometheus
                static_configs:
                  - targets:
                      - localhost:9090
              - job_name: kubernetes-service-endpoints
                honor_labels: true
                kubernetes_sd_configs:
                  - role: endpoints
                relabel_configs:
                  - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
                    action: keep
                    regex: true
                  # Drop CNPG services - pods are scraped via kubernetes-pods job
                  - source_labels: [__meta_kubernetes_service_label_cnpg_io_cluster]
                    action: drop
                    regex: .+
                  - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape_slow]
                    action: drop
                    regex: true
                  - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
                    action: replace
                    target_label: __scheme__
                    regex: (https?)
                  - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
                    action: replace
                    target_label: __metrics_path__
                    regex: (.+)
                  - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
                    action: replace
                    target_label: __address__
                    regex: (.+?)(?::\d+)?;(\d+)
                    replacement: $1:$2
                  - action: labelmap
                    regex: __meta_kubernetes_service_label_(.+)
                  - source_labels: [__meta_kubernetes_namespace]
                    action: replace
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_service_name]
                    action: replace
                    target_label: service
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    action: replace
                    target_label: node
              - job_name: kubernetes-pods
                honor_labels: true
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                    action: keep
                    regex: true
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape_slow]
                    action: drop
                    regex: true
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
                    action: replace
                    regex: (https?)
                    target_label: __scheme__
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                    action: replace
                    target_label: __metrics_path__
                    regex: (.+)
                  - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                    action: replace
                    regex: (.+?)(?::\d+)?;(\d+)
                    replacement: $1:$2
                    target_label: __address__
                  - action: labelmap
                    regex: __meta_kubernetes_pod_label_(.+)
                  - source_labels: [__meta_kubernetes_namespace]
                    action: replace
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_name]
                    action: replace
                    target_label: pod
                  - source_labels: [__meta_kubernetes_pod_phase]
                    regex: Pending|Succeeded|Failed|Completed
                    action: drop
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    action: replace
                    target_label: node

        # Additional scrape configs
        extraScrapeConfigs: |
          - job_name: node-exporter
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names:
                    - observability
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name]
                action: keep
                regex: node-exporter
              - source_labels: [__meta_kubernetes_endpoint_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
          - job_name: kube-state-metrics
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names:
                    - observability
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name]
                action: keep
                regex: kube-state-metrics
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
          - job_name: integrations/blackbox/guava-app
            metrics_path: /probe
            params:
              module: [http_2xx]
            static_configs:
              - targets:
                  - https://app.guavascheduler.com/health
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: blackbox-exporter.observability.svc:9115

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
