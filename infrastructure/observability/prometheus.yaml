apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 28.9.0
    helm:
      releaseName: prometheus
      valuesObject:
        fullnameOverride: prometheus

        # Disable components we already have or don't need
        alertmanager:
          enabled: false
        kube-state-metrics:
          enabled: false  # Already deployed separately
        prometheus-node-exporter:
          enabled: false  # Already deployed separately
        prometheus-pushgateway:
          enabled: false

        server:
          fullnameOverride: prometheus

          # Persistent storage with Longhorn
          persistentVolume:
            enabled: true
            size: 20Gi
            storageClass: longhorn

          # Retention
          retention: 15d

          # Resources
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi

          # Pod annotations for self-scraping
          podAnnotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9090"

        # Additional scrape configs (chart provides kubernetes-pods, nodes, cadvisor)
        extraScrapeConfigs: |
          - job_name: node-exporter
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names:
                    - observability
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name]
                action: keep
                regex: node-exporter
              - source_labels: [__meta_kubernetes_endpoint_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
          - job_name: kube-state-metrics
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names:
                    - observability
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name]
                action: keep
                regex: kube-state-metrics
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
          - job_name: integrations/blackbox/guava-app
            metrics_path: /probe
            params:
              module: [http_2xx]
            static_configs:
              - targets:
                  - https://app.guavasuite.com/health
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: blackbox-exporter.observability.svc:9115
          - job_name: longhorn
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names:
                    - longhorn-system
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name]
                action: keep
                regex: longhorn-backend
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
