apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 8.8.2
    helm:
      releaseName: grafana
      valuesObject:
        # No persistent storage
        persistence:
          enabled: false

        # Admin credentials from SealedSecret
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password

        # Dashboard provisioning
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default

        dashboardsConfigMaps:
          default: grafana-dashboards

        # Datasources provisioning
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Mimir
                uid: mimir
                type: prometheus
                url: http://mimir-nginx.observability.svc/prometheus
                isDefault: true
                editable: false
              - name: Loki
                uid: loki
                type: loki
                url: http://loki.observability.svc:3100
                editable: false

        # Ingress - adjust domain as needed
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - grafana.vacant.dev
          tls:
            - secretName: grafana-tls
              hosts:
                - grafana.vacant.dev

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: []
