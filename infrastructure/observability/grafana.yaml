apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.5
    helm:
      releaseName: grafana
      valuesObject:
        # No persistent storage
        persistence:
          enabled: false

        # Admin credentials from SealedSecret
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password

        # Dashboard provisioning
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/default
              - name: cluster
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/cluster
              - name: namespace
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/namespace
              - name: observability
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/observability
              - name: nodes
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/nodes

        dashboardsConfigMaps:
          default: grafana-dashboard-guava
          cluster: grafana-dashboard-cluster
          namespace: grafana-dashboard-namespace
          observability: grafana-dashboard-observability
          nodes: grafana-dashboard-nodes

        # Datasources provisioning
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Mimir
                uid: mimir
                type: prometheus
                url: http://mimir.observability.svc:8080/prometheus
                isDefault: true
                editable: false
              - name: Loki
                uid: loki
                type: loki
                url: http://loki.observability.svc:3100
                editable: false
              - name: Tempo
                uid: tempo
                type: tempo
                url: http://tempo.observability.svc:3200
                editable: false
                jsonData:
                  tracesToLogsV2:
                    datasourceUid: loki
                    spanStartTimeShift: '-1h'
                    spanEndTimeShift: '1h'
                    filterByTraceID: true
                    filterBySpanID: false
                  lokiSearch:
                    datasourceUid: loki

        # Ingress - adjust domain as needed
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - grafana.vacant.dev
          tls:
            - secretName: grafana-tls
              hosts:
                - grafana.vacant.dev

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: []
