apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15
    helm:
      releaseName: grafana
      valuesObject:
        fullnameOverride: grafana

        revisionHistoryLimit: 3

        # No persistent storage
        persistence:
          enabled: false

        # Disable login form, trust Authelia forward auth headers
        grafana.ini:
          auth:
            disable_login_form: true
          auth.proxy:
            enabled: true
            header_name: Remote-User
            header_property: username
            auto_sign_up: true
            headers: "Email:Remote-Email Name:Remote-Name Groups:Remote-Groups"
          users:
            auto_assign_org: true
            auto_assign_org_role: Admin

        # Dashboard provisioning
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/default
              - name: cluster
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/cluster
              - name: namespace
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/namespace
              - name: observability
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/observability
              - name: nodes
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/nodes
              - name: postgresql
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/postgresql
              - name: longhorn
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/longhorn

        dashboardsConfigMaps:
          cluster: grafana-dashboard-cluster
          namespace: grafana-dashboard-namespace
          observability: grafana-dashboard-observability
          nodes: grafana-dashboard-nodes
          postgresql: grafana-dashboard-postgresql
          longhorn: grafana-dashboard-longhorn

        # Datasources provisioning
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                url: http://prometheus.observability.svc:80
                isDefault: true
                editable: false
              - name: Loki
                uid: loki
                type: loki
                url: http://loki.observability.svc:3100
                editable: false
              - name: Tempo
                uid: tempo
                type: tempo
                url: http://tempo.observability.svc:3200
                editable: false
                jsonData:
                  tracesToLogsV2:
                    datasourceUid: loki
                    spanStartTimeShift: '-1h'
                    spanEndTimeShift: '1h'
                    filterByTraceID: true
                    filterBySpanID: false
                  lokiSearch:
                    datasourceUid: loki

        # Ingress - adjust domain as needed
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            traefik.ingress.kubernetes.io/router.middlewares: authelia-authelia-forwardauth@kubernetescrd
          hosts:
            - grafana.vacant.dev
          tls:
            - hosts:
                - grafana.vacant.dev

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: []
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
