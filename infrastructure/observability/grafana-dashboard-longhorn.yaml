          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": {
                "align": "auto",
                "cellOptions": { "type": "auto" },
                "inspect": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "text", "value": null }]
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Volume" },
                "properties": [{ "id": "custom.width", "value": 250 }]
              },
              {
                "matcher": { "id": "byName", "options": "Capacity" },
                "properties": [{ "id": "unit", "value": "bytes" }]
              },
              {
                "matcher": { "id": "byName", "options": "Used" },
                "properties": [{ "id": "unit", "value": "bytes" }]
              },
              {
                "matcher": { "id": "byName", "options": "Usage %" },
                "properties": [
                  { "id": "unit", "value": "percent" },
                  { "id": "custom.cellOptions", "value": { "mode": "gradient", "type": "gauge" } },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 85 }] } },
                  { "id": "min", "value": 0 },
                  { "id": "max", "value": 100 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Robustness" },
                "properties": [
                  { "id": "mappings", "value": [
                    { "options": { "healthy": { "color": "green", "index": 0, "text": "Healthy" }, "degraded": { "color": "yellow", "index": 1, "text": "Degraded" }, "faulted": { "color": "red", "index": 2, "text": "Faulted" } }, "type": "value" }
                  ]},
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              }
            ]
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
