              "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "Time 3": true, "Time 4": true, "__name__": true, "__name__ 1": true, "__name__ 2": true, "__name__ 3": true, "instance": true, "instance 1": true, "instance 2": true, "instance 3": true, "job": true, "job 1": true, "job 2": true, "job 3": true, "node": true, "node 1": true, "node 2": true, "node 3": true, "pvc": true, "pvc 1": true, "pvc 2": true, "pvc 3": true, "pvc_namespace": true, "pvc_namespace 1": true, "pvc_namespace 2": true, "pvc_namespace 3": true, "namespace": true, "namespace 1": true, "namespace 2": true, "namespace 3": true, "robustness": true },
              "renameByName": { "volume": "Volume", "Value #Capacity": "Capacity", "Value #Used": "Used", "Value #Percent": "Usage %", "Value #Robustness": "Robustness" }
            }}
          ],
          "type": "table"
