apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-guava-traces
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  guava-traces.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": ["guava"],
          "targetBlank": false,
          "title": "Guava Metrics",
          "type": "dashboards"
        }
      ],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "panels": [],
          "title": "All Traces",
          "type": "row"
        },
        {
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 14, "w": 24, "x": 0, "y": 1 },
          "id": 1,
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "queryType": "traceqlSearch",
              "query": "{resource.service.name=\"guava-api\"}",
              "limit": 50,
              "tableType": "traces",
              "refId": "A"
            }
          ],
          "title": "All Guava Traces",
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 },
          "id": 101,
          "panels": [],
          "title": "RPC Methods",
          "type": "row"
        },
        {
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 16 },
          "id": 2,
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "queryType": "traceqlSearch",
              "query": "{resource.service.name=\"guava-api\" && span.rpc.service=\"user.v1.UserService\"}",
              "limit": 20,
              "tableType": "traces",
              "refId": "A"
            }
          ],
          "title": "User Service Traces",
          "type": "table"
        },
        {
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 16 },
          "id": 3,
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "queryType": "traceqlSearch",
              "query": "{resource.service.name=\"guava-api\" && span.rpc.service=~\".*RotationSchedule.*\"}",
              "limit": 20,
              "tableType": "traces",
              "refId": "A"
            }
          ],
          "title": "Rotation Schedule Service Traces",
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 },
          "id": 102,
          "panels": [],
          "title": "Database Traces",
          "type": "row"
        },
        {
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 27 },
          "id": 4,
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "queryType": "traceqlSearch",
              "query": "{resource.service.name=\"guava-api\" && span.db.system=\"postgresql\"}",
              "limit": 30,
              "tableType": "traces",
              "refId": "A"
            }
          ],
          "title": "PostgreSQL Query Traces",
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 37 },
          "id": 103,
          "panels": [],
          "title": "Slow & Error Traces",
          "type": "row"
        },
        {
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 38 },
          "id": 5,
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "queryType": "traceqlSearch",
              "query": "{resource.service.name=\"guava-api\" && kind=server && duration > 100ms}",
              "limit": 20,
              "tableType": "traces",
              "refId": "A"
            }
          ],
          "title": "Slow Traces (>100ms)",
          "type": "table"
        },
        {
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 38 },
          "id": 6,
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "queryType": "traceqlSearch",
              "query": "{resource.service.name=\"guava-api\" && status=error}",
              "limit": 20,
              "tableType": "traces",
              "refId": "A"
            }
          ],
          "title": "Error Traces",
          "type": "table"
        }
      ],
      "preload": false,
      "schemaVersion": 40,
      "tags": ["guava", "traces"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Guava Traces",
      "uid": "guava-traces",
      "version": 1,
      "weekStart": ""
    }
