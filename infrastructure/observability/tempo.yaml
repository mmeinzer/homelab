apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.1
    helm:
      releaseName: tempo
      valuesObject:
        # Explicit name to ensure predictable service naming
        fullnameOverride: tempo

        tempo:
          storage:
            trace:
              backend: local
              local:
                path: /var/tempo/traces
              wal:
                path: /var/tempo/wal
          retention: 360h  # 15 days
          reportingEnabled: false
          metricsGenerator:
            enabled: false
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: "0.0.0.0:4317"
                http:
                  endpoint: "0.0.0.0:4318"

        # Single replica monolithic deployment
        replicas: 1

        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "3200"

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi

        # Enable persistence with Longhorn
        persistence:
          enabled: true
          size: 10Gi
          storageClassName: longhorn

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: []
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
