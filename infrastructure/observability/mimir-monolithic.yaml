---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  mimir.yaml: |
    # Run all components in a single process
    target: all

    # Multi-tenancy disabled for homelab
    multitenancy_enabled: false

    # Server configuration
    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
      log_level: info

    # Common storage configuration for R2
    common:
      storage:
        backend: s3
        s3:
          endpoint: afc0de0b67de79f311811d5c36e790bd.r2.cloudflarestorage.com
          bucket_name: mimir-homelab
          region: auto
          access_key_id: ${ACCESS_KEY_ID}
          secret_access_key: ${SECRET_ACCESS_KEY}
          insecure: false

    # Block storage (metrics data)
    blocks_storage:
      backend: s3
      s3:
        bucket_name: mimir-homelab
      bucket_store_config:
        bucket_index:
          enabled: true
      tsdb:
        dir: /data/tsdb

    # Ruler storage (not used, use local filesystem)
    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/ruler

    # Alertmanager storage (not used, use local filesystem)
    alertmanager_storage:
      backend: filesystem
      filesystem:
        dir: /data/alertmanager

    # Compactor configuration
    compactor:
      data_dir: /data/compactor
      compaction_interval: 30m
      deletion_delay: 2h
      sharding_ring:
        kvstore:
          store: memberlist

    # Ingester configuration
    ingester:
      ring:
        replication_factor: 1
        kvstore:
          store: memberlist

    # Store gateway configuration
    store_gateway:
      sharding_ring:
        replication_factor: 1
        kvstore:
          store: memberlist

    # Limits configuration
    limits:
      native_histograms_ingestion_enabled: true
      compactor_blocks_retention_period: 720h  # 30 days

    # Memberlist for ring coordination (single instance)
    memberlist:
      join_members: []

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: mimir
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:2.14.0
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -config.expand-env=true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9095
              protocol: TCP
          env:
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: access_key_id
            - name: SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: secret_access_key
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: mimir
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: grpc
      protocol: TCP
  selector:
    app: mimir
