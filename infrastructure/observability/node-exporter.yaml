apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-node-exporter
    targetRevision: 4.52.0
    helm:
      releaseName: node-exporter
      valuesObject:
        fullnameOverride: node-exporter

        # Run on all nodes including control plane
        tolerations:
          - effect: NoSchedule
            operator: Exists

        # Resource limits for homelab
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

        # Service configuration for scraping
        service:
          port: 9100
          targetPort: 9100
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9100"

        # Prometheus scraping config
        prometheus:
          monitor:
            enabled: false  # We use Alloy, not Prometheus Operator

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: []
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
