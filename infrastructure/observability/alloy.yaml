apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.12.0
    helm:
      releaseName: alloy
      valuesObject:
        fullnameOverride: alloy

        alloy:
          # Expose OTLP ports for trace ingestion
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
          configMap:
            content: |
              // ============================================
              // LOGGING: Collect and forward logs to Loki
              // ============================================

              // Discover Kubernetes pods
              discovery.kubernetes "pods" {
                role = "pod"
              }

              // Discover pods for log collection
              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app_kubernetes_io_name"
                }
              }

              // Collect logs from Kubernetes pods
              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.default.receiver]
              }

              // Send logs to Loki
              loki.write "default" {
                endpoint {
                  url = "http://loki.observability.svc:3100/loki/api/v1/push"
                }
              }

              // ============================================
              // TRACING: OTLP receiver and Tempo forwarding
              // ============================================

              // OTLP receiver for traces from instrumented applications
              otelcol.receiver.otlp "default" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                }
                http {
                  endpoint = "0.0.0.0:4318"
                }
                output {
                  traces = [otelcol.processor.k8sattributes.default.input]
                }
              }

              // Extracting Kubernetes metadata and adding to traces
              otelcol.processor.k8sattributes "default" {
                extract {
                  metadata = [
                    "k8s.namespace.name",
                    "k8s.pod.name",
                    "k8s.pod.uid",
                    "k8s.deployment.name",
                    "k8s.node.name",
                  ]
                }
                pod_association {
                  source {
                    from = "connection"
                  }
                }
                output {
                  traces = [otelcol.processor.batch.default.input]
                }
              }

              // Batch processor for efficient trace forwarding
              otelcol.processor.batch "default" {
                timeout = "5s"
                send_batch_size = 8192
                send_batch_max_size = 16384
                output {
                  traces = [otelcol.exporter.otlp.tempo.input]
                }
              }

              // Export traces to Tempo
              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.observability.svc:4317"
                  tls {
                    insecure = true
                  }
                }
              }

          # Resources for the Alloy container
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

        # Run as DaemonSet to collect from all nodes
        controller:
          type: daemonset

        # RBAC for Kubernetes discovery
        serviceAccount:
          create: true

        rbac:
          create: true

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: []
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
