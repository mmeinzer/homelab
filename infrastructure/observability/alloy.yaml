apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.5.1
    helm:
      releaseName: alloy
      valuesObject:
        alloy:
          configMap:
            content: |
              // Discover Kubernetes pods
              discovery.kubernetes "pods" {
                role = "pod"
              }

              // Discover Kubernetes nodes
              discovery.kubernetes "nodes" {
                role = "node"
              }

              // Relabel nodes to use kubelet address
              discovery.relabel "kubelet" {
                targets = discovery.kubernetes.nodes.targets

                rule {
                  source_labels = ["__meta_kubernetes_node_address_InternalIP"]
                  target_label  = "__address__"
                  replacement   = "$1:10250"
                }

                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  target_label  = "node"
                }
              }

              // Relabel discovered pods for scraping
              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                // Only scrape pods with prometheus.io/scrape annotation
                rule {
                  source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
                  regex         = "true"
                  action        = "keep"
                }

                // Use custom port if specified
                rule {
                  source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
                  regex         = "(\\d+);(.+)"
                  target_label  = "__address__"
                  replacement   = "$2:$1"
                  action        = "replace"
                }

                // Use custom path if specified
                rule {
                  source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
                  regex         = "(.+)"
                  target_label  = "__metrics_path__"
                  action        = "replace"
                }

                // Add pod labels
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
              }

              // Scrape metrics from pods
              prometheus.scrape "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              // Scrape kubelet metrics
              prometheus.scrape "kubelet" {
                targets = discovery.relabel.kubelet.output
                scheme  = "https"
                tls_config {
                  insecure_skip_verify = true
                }
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              // Scrape cAdvisor metrics
              prometheus.scrape "cadvisor" {
                targets = discovery.relabel.kubelet.output
                scheme  = "https"
                metrics_path = "/metrics/cadvisor"
                tls_config {
                  insecure_skip_verify = true
                }
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              // Remote write to Mimir
              prometheus.remote_write "mimir" {
                endpoint {
                  url = "http://mimir-nginx.observability.svc/api/v1/push"
                }
              }

              // Discover pods for log collection
              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app_kubernetes_io_name"
                }
              }

              // Collect logs from Kubernetes pods
              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.default.receiver]
              }

              // Send logs to Loki
              loki.write "default" {
                endpoint {
                  url = "http://loki.observability.svc:3100/loki/api/v1/push"
                }
              }

          # Resources for the Alloy container
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

        # Run as DaemonSet to collect from all nodes
        controller:
          type: daemonset

        # RBAC for Kubernetes discovery
        serviceAccount:
          create: true

        rbac:
          create: true

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: []
