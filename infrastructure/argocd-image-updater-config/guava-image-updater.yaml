apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: guava
  namespace: argocd
spec:
  namespace: argocd
  commonUpdateSettings:
    updateStrategy: newest-build
    allowTags: "regexp:^[0-9a-f]{7,40}$"
    pullSecret: pullsecret:argocd/ghcr-pullsecret
  writeBackConfig:
    method: "git:secret:argocd/argocd-image-updater-git-creds"
  applicationRefs:
    - namePattern: "guava"
      images:
        - alias: server
          imageName: ghcr.io/mmeinzer/guava
        - alias: solver
          imageName: ghcr.io/mmeinzer/guava-solver
