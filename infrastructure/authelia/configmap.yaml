apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  configuration.yml: |
    theme: auto

    server:
      address: 'tcp://:9091'

    log:
      level: info

    authentication_backend:
      file:
        path: /secrets/users.yaml

    session:
      cookies:
        - domain: 'vacant.dev'
          authelia_url: 'https://auth.vacant.dev'
          default_redirection_url: 'https://grafana.vacant.dev'
      redis:
        host: '10.12.14.175'
        port: 6379

    storage:
      local:
        path: /data/db.sqlite3

    notifier:
      filesystem:
        filename: /data/notification.txt

    access_control:
      default_policy: one_factor
      rules:
        - domain: '*.vacant.dev'
          policy: one_factor
