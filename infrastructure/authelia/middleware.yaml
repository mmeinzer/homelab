apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia-forwardauth
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  forwardAuth:
    address: http://authelia.authelia.svc:9091/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Email
      - Remote-Name
